<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkVault — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #09090b;
        color: #fafafa;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        padding: 32px;
        border-radius: 20px;
        background: #18181b;
        border: 1px solid #27272a;
        text-align: center;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: rgba(79, 70, 229, 0.16);
        color: #818cf8;
        font-weight: 700;
        font-size: 22px;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 700;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.5;
        color: #a1a1aa;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 10px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        background: #4f46e5;
        color: #fff;
        cursor: pointer;
      }
      button:hover {
        background: #4338ca;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">LV</div>
      <h1>You're offline</h1>
      <p>
        LinkVault couldn't reach the network right now. Your cached links are stored locally and will sync automatically when you're back online.
      </p>
      <button onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
